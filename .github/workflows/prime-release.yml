# NovaPlayer Prime: build signed APKs and publish them as a GitHub Release.
# The in-app updater reads the latest release; its tag must be "prime-<versionCode>".
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   PRIME_KEYSTORE_BASE64    base64 of the release keystore (.jks)
#   PRIME_KEYSTORE_PASSWORD  keystore password
#   PRIME_KEY_ALIAS          key alias
#   PRIME_KEY_PASSWORD       key password
# Use the SAME keystore forever: Android refuses updates signed with a different key.
name: NovaPlayer Prime release

on:
  push:
    branches: [ prime ]
    paths-ignore: [ '**.md', 'docs/**', 'faq/**', 'fastlane/**' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prime-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
    - name: check signing secrets
      env:
        KS: ${{ secrets.PRIME_KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KS" ]; then
          echo "::error::PRIME_KEYSTORE_BASE64 secret is missing. See the Building section of README.md"
          exit 1
        fi

    - name: setup java17
      uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: install packages
      run: |
        sudo apt-get update || sudo apt-get update
        sudo apt-get install -y nasm meson ninja-build maven build-essential wget curl unzip git pkg-config

    - name: install repo
      run: |
        curl https://storage.googleapis.com/git-repo-downloads/repo | sudo tee /usr/local/bin/repo > /dev/null
        sudo chmod a+x /usr/local/bin/repo

    - name: retrieve full source (NOVA upstream + Prime forks)
      env:
        MANIFEST_URL: https://github.com/${{ github.repository }}
        MANIFEST_BRANCH: ${{ github.ref_name }}
      run: |
        git config --global user.email "ci@users.noreply.github.com"
        git config --global user.name "CI"
        mkdir nova
        cd nova
        repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" -m prime.xml
        repo sync -j 4
        repo forall -c 'git checkout -t $REPO_REMOTE/$REPO_RREV'

    - name: wait for a new version number
      # NOVA's versionCode only changes every 1000 seconds (see getDate() in Video/build.gradle).
      # Two builds inside the same window would share one release tag, and the updater
      # could then download the older APK. Wait until this build gets a code above every
      # existing prime-* release (same formula as build.gradle; Gradle runs later, so >=).
      env:
        REPO_GIT: https://github.com/${{ github.repository }}
      run: |
        latest=$(git ls-remote --tags "$REPO_GIT" 'prime-*' | sed -nE 's#.*refs/tags/prime-([0-9]+)$#\1#p' | sort -n | tail -1)
        latest=${latest:-0}
        code() { echo $(( 2549909 + ( $(date +%s) - 1472637600 - 108380000 - 88364898 ) / 1000 )); }
        echo "latest release code: $latest, current code: $(code)"
        while [ "$(code)" -le "$latest" ]; do sleep 30; done
        echo "building with code >= $(code)"

    - name: signing config
      env:
        KS: ${{ secrets.PRIME_KEYSTORE_BASE64 }}
        KS_PASS: ${{ secrets.PRIME_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.PRIME_KEY_ALIAS }}
        KEY_PASS: ${{ secrets.PRIME_KEY_PASSWORD }}
      run: |
        cd nova/Video
        echo "$KS" | base64 -d > prime-release.jks
        {
          echo "storeFile=prime-release.jks"
          echo "storePassword=$KS_PASS"
          echo "keyAlias=$KEY_ALIAS"
          echo "keyPassword=$KEY_PASS"
        } > keystore.properties

    - name: build
      env:
        ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_LATEST_HOME }}
      run: |
        export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
        export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
        cd nova/Video
        ./gradlew assembleNoamazonRelease

    - name: collect APKs
      id: apks
      run: |
        mkdir -p out
        find nova/Video/build/outputs/apk -name '*-release.apk' -exec cp {} out/ \;
        # Also attach "prime-<abi>.apk": the in-app updater downloads these fixed names
        # through github.com links, so it never needs the rate-limited GitHub API.
        for f in out/*-release.apk; do
          abi=$(basename "$f" | sed -nE 's/.*-(arm64-v8a|armeabi-v7a|x86_64|x86|universal)-release\.apk$/\1/p')
          if [ -n "$abi" ]; then cp "$f" "out/prime-$abi.apk"; fi
        done
        ls -l out
        first=$(ls out/*-release.apk | head -1)
        # file names look like org.courville.nova-<versionCode>-<versionName>-<abi>-release.apk
        code=$(basename "$first" | sed -E 's/^[^-]+-([0-9]+)-.*/\1/')
        vname=$(basename "$first" | sed -E 's/^[^-]+-[0-9]+-([0-9.]+-[0-9.]+)-.*/\1/')
        echo "code=$code" >> "$GITHUB_OUTPUT"
        echo "name=$vname" >> "$GITHUB_OUTPUT"
        rm -f nova/Video/prime-release.jks nova/Video/keystore.properties

    - name: publish release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        tag_name: prime-${{ steps.apks.outputs.code }}
        name: Nova Player Plus ${{ steps.apks.outputs.name }}
        target_commitish: ${{ github.sha }}
        make_latest: true
        body: |
          Nova Player Plus ${{ steps.apks.outputs.name }} (build ${{ steps.apks.outputs.code }}).
          Based on NOVA Video Player by the NOVA developers; forked and customized by tasin-py.
          Install the APK matching your device: most Android TVs use armeabi-v7a or arm64-v8a.
          Already installed? Settings > Nova Player Plus > Check for updates.
        files: out/*.apk
